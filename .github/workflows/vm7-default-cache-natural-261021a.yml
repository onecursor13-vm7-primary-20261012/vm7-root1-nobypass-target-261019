name: VM7 Default Cache Natural Replay 261021a

on:
  push:
    branches:
      - vm7-default-cache-natural-261021a

permissions:
  contents: read

jobs:
  consume:
    if: github.actor == 'mergify[bot]'
    runs-on: ubuntu-latest
    environment: vm7-default-cache-natural-env-261021a
    steps:
      - uses: actions/checkout@v4
      - name: Execute fixed protected hook
        env:
          VM7_DEFAULT_CACHE_SECRET: ${{ secrets.VM7_DEFAULT_CACHE_SECRET_261021A }}
        run: bash ./vm7-default-cache-deploy-261021a.sh
      - name: Publish controlled proof
        uses: actions/upload-artifact@v4
        with:
          name: vm7-default-cache-proof-261021a
          path: |
            protected-proof.bin
            merge-sha.txt
          if-no-files-found: error
          retention-days: 1
