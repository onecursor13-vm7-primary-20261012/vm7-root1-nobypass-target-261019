name: VM7 Default Cache Post-transition New PR Replay 261021b

on:
  push:
    branches:
      - vm7-default-cache-postnew-261021b

permissions:
  contents: read

jobs:
  consume:
    if: github.actor == 'mergify[bot]'
    runs-on: ubuntu-latest
    environment: vm7-default-cache-postnew-env-261021b
    steps:
      - uses: actions/checkout@v4
      - name: Execute fixed protected hook
        env:
          VM7_DEFAULT_CACHE_SECRET: ${{ secrets.VM7_DEFAULT_CACHE_SECRET_261021B }}
        run: bash ./vm7-default-cache-deploy-261021b.sh
      - name: Publish controlled proof
        uses: actions/upload-artifact@v4
        with:
          name: vm7-default-cache-proof-261021b
          path: |
            protected-proof.bin
            merge-sha.txt
          if-no-files-found: error
          retention-days: 1
