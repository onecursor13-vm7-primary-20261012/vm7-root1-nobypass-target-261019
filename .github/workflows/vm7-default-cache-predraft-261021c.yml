name: VM7 Default Cache Pre-draft Ready Replay 261021c

on:
  push:
    branches:
      - vm7-default-cache-predraft-261021c

permissions:
  contents: read

jobs:
  consume:
    if: github.actor == 'mergify[bot]'
    runs-on: ubuntu-latest
    environment: vm7-default-cache-predraft-env-261021c
    steps:
      - uses: actions/checkout@v4
      - name: Execute fixed protected hook
        env:
          VM7_DEFAULT_CACHE_SECRET: ${{ secrets.VM7_DEFAULT_CACHE_SECRET_261021C }}
        run: bash ./vm7-default-cache-deploy-261021c.sh
      - name: Publish controlled proof
        uses: actions/upload-artifact@v4
        with:
          name: vm7-default-cache-proof-261021c
          path: |
            protected-proof.bin
            merge-sha.txt
          if-no-files-found: error
          retention-days: 1
